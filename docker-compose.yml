services:
  api:
    build:
      context: ./api
      args:
        - BUILD_NUMBER=${BUILD_NUMBER:-local}
        - COMMIT_HASH=${GIT_COMMIT_SHORT:-unknown}
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - BUILD_NUMBER=${BUILD_NUMBER:-local}
        - COMMIT_HASH=${GIT_COMMIT_SHORT:-unknown}
    ports:
      - "8000:8000"
    depends_on:
      - api
    restart: unless-stopped