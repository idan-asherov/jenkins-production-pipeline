services:
  api:
    build:
      context: ./api
      args:
        - BUILD_NUMBER=${BUILD_NUMBER:-local}
        - COMMIT_HASH=${GIT_COMMIT_SHORT:-unknown}
    networks:
      - bg-network
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        - BUILD_NUMBER=${BUILD_NUMBER:-local}
        - COMMIT_HASH=${GIT_COMMIT_SHORT:-unknown}
    environment:
      - API_HOST=${COMPOSE_PROJECT_NAME}-api-1
    networks:
      - bg-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  bg-network:
    external: true
